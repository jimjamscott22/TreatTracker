name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so CI cannot
      # silently drift onto a different dependency tree than a contributor has.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # The production export is an architectural quality gate in
      # docs/architecture.md: it catches bundler and module-resolution breakage
      # that typechecking and unit tests do not.
      - name: Production export
        run: npm run export:check
